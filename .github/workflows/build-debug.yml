name: Build Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install project SDK
        run: |
          set -o pipefail
          sdkmanager "cmdline-tools;latest" 2>&1 | tee sdk-tools.log
          sdk_manager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_manager" --list --channel=3 > sdk-packages.log 2>&1
          if ! awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' sdk-packages.log | grep -Fx 'platforms;android-37' > /dev/null; then
            echo '::error::SDK repository does not advertise platforms;android-37, even with preview channels. See sdk-packages.log. Project SDK was not changed.'
            exit 1
          fi
          "$sdk_manager" --channel=3 "platforms;android-37" "build-tools;36.0.0" "platform-tools" 2>&1 | tee sdk-install.log

      - name: Build Debug APK
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee debug-build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Intentcleaner-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            sdk-tools.log
            sdk-packages.log
            sdk-install.log
            debug-build.log
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
